<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bomb Zone</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Bomb Zone PVP Game</h1>
    <div class="container">
      <canvas id="gameCanvas"></canvas>
      <div class="instructions">
        <p>Use Keys <kbd>W, S, A, S</kbd> for movement and <kbd>Space</kbd> for placing bomb for player1</p>
        <p>
          Use Keys <kbd>Up</kbd>, <kbd>Down</kbd>, <kbd>Left</kbd>, <kbd>Right</kbd> for movement and
          <kbd>Enter</kbd> for placing bomb for player2
        </p>
      </div>
    </div>

    <script src="variables.js"></script>
    <script src="keys.js"></script>
    <script src="game.js"></script>
    <script language="JavaScript">
      startGame();
    </script>
  </body>
</html>
