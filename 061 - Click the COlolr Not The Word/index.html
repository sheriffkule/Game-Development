<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click the Color Not The Word</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Click the Color Not The Word</h1>
      <p class="game-description">
        Click the button that matches the COLOR of the word, not the word itself. This tests your ability to
        ignore conflicting information!
      </p>

      <div class="stats-container">
        <div class="stat-box">
          <div class="stat-value" id="score">0</div>
          <div class="stat-label">Score</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="streak">0</div>
          <div class="stat-label">Streak</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="highScore">0</div>
          <div class="stat-label">High Score</div>
        </div>
      </div>

      <div class="game-area">
        <div class="timer-container" id="timerContainer">
          <div class="timer-bar" id="timerBar"></div>
        </div>

        <div class="target-container">
          <div class="target-word" id="targetWord">Red</div>
          <div class="target-instructions">Click the color of this text:</div>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="color-options" id="colorOptions">
          <!-- Options will be generated by JavaScript -->
        </div>

        <div class="controls">
          <button class="btn-primary" id="startBtn">Start Game</button>
          <button class="btn-primary" id="resetBtn">Reset</button>
        </div>
      </div>
    </div>
  </body>
</html>
